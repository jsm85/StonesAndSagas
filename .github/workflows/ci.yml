name: CI

# Every pull request must install, typecheck and build cleanly.
# A PR that does not build should not be mergeable.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >=22.12.0. Keep in step with package.json
          # "engines" and the deploy workflow.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
